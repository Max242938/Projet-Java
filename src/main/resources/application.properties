spring.application.name=projet-java
spring.datasource.url=jdbc:h2:file:./data/smarthome;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.file.name=./logs/smarthome.log
smarthome.simulator.enabled=true
smarthome.console.enabled=true
