spring.application.name=projet-java
spring.datasource.url=jdbc:h2:file:./data/smarthome;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
logging.file.name=./logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
smarthome.simulator.enabled=true
smarthome.simulator.loop-enabled=true
smarthome.simulator.interval-ms=10000
smarthome.console.enabled=true
